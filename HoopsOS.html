<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HoopsOS</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600&display=swap');

  :root {
    --bg-dark: #120c08;
    --panel-bg: rgba(36, 24, 15, 0.85);
    --panel-border: #4a3520;
    --accent: #ff7a29;
    --text-main: #f1e6cf;
    --text-muted: #a3876a;
  }

  * { box-sizing: border-box; user-select: none; margin: 0; padding: 0; }
  body {
    width: 100vw; height: 100vh; overflow: hidden;
    font-family: 'IBM Plex Mono', monospace;
    background: var(--bg-dark); color: var(--text-main);
  }

  /* Wallpapers */
  #desktop {
    width: 100%; height: 100%; position: relative;
    background: repeating-linear-gradient(90deg, #1b120a 0px, #1b120a 3px, #150d06 3px, #150d06 42px);
    transition: background 0.3s;
  }

  /* Top Bar */
  #topbar {
    height: 32px; background: rgba(18, 12, 8, 0.9);
    border-bottom: 1px solid var(--panel-border);
    display: flex; justify-content: space-between; align-items: center;
    padding: 0 12px; font-size: 12px; position: relative; z-index: 10000;
  }
  .brand { color: var(--accent); font-weight: bold; }

  /* Desktop Grid & Icons */
  #icons-grid {
    display: flex; flex-direction: column; flex-wrap: wrap;
    gap: 16px; padding: 16px; height: calc(100% - 80px); width: max-content;
  }
  .app-icon {
    width: 76px; display: flex; flex-direction: column; align-items: center;
    gap: 6px; cursor: pointer; text-align: center; font-size: 11px;
  }
  .app-icon .glyph {
    width: 48px; height: 48px; background: var(--panel-bg);
    border: 1px solid var(--panel-border); border-bottom: 3px solid var(--accent);
    border-radius: 8px; display: grid; place-items: center; font-size: 22px;
  }

  /* Window Shell */
  .window {
    position: absolute; min-width: 280px; min-height: 180px;
    background: var(--panel-bg); backdrop-filter: blur(12px);
    border: 1px solid var(--panel-border); border-top: 2px solid var(--accent);
    border-radius: 6px; box-shadow: 0 10px 30px rgba(0,0,0,0.5);
    display: flex; flex-direction: column; overflow: hidden;
  }
  .window.focused { border-color: var(--accent); }
  .titlebar {
    height: 32px; background: rgba(0, 0, 0, 0.2);
    display: flex; align-items: center; justify-content: space-between;
    padding: 0 10px; cursor: grab; font-size: 12px; border-bottom: 1px solid var(--panel-border);
  }
  .win-controls button {
    width: 12px; height: 12px; border-radius: 50%; border: none; cursor: pointer; margin-left: 4px;
  }
  .btn-close { background: #e6484f; }
  .btn-min { background: #f2c14e; }
  .win-body { flex: 1; padding: 12px; overflow: auto; font-size: 12px; }

  /* Dock */
  #dock-wrap {
    position: absolute; bottom: 12px; left: 0; right: 0;
    display: flex; justify-content: center; z-index: 9999;
  }
  #dock {
    display: flex; gap: 8px; background: var(--panel-bg);
    border: 1px solid var(--panel-border); padding: 6px 12px; border-radius: 12px;
  }
  .dock-item {
    width: 40px; height: 40px; background: rgba(0,0,0,0.3);
    border: 1px solid var(--panel-border); border-radius: 6px;
    display: grid; place-items: center; font-size: 20px; cursor: pointer;
    position: relative; transition: transform 0.15s;
  }
  .dock-item:hover { transform: translateY(-4px); }
  .dock-item.active::after {
    content: ''; position: absolute; bottom: 2px; width: 4px; height: 4px;
    background: var(--accent); border-radius: 50%;
  }

  /* Component Utility UI */
  textarea, input, button {
    font-family: inherit; color: inherit; background: rgba(0,0,0,0.3);
    border: 1px solid var(--panel-border); border-radius: 4px; padding: 6px;
  }
  button { cursor: pointer; background: var(--panel-bg); }
  button:hover { border-color: var(--accent); }
  .num-display { font-size: 32px; text-align: center; color: var(--accent); margin: 8px 0; }
</style>
</head>
<body>

<div id="desktop">
  <div id="topbar">
    <span class="brand">🏀 HoopsOS</span>
    <span id="clock">00:00 AM</span>
  </div>

  <div id="icons-grid"></div>

  <div id="dock-wrap">
    <div id="dock"></div>
  </div>
</div>

<script>
// Application Registry
const APPS = {
  playbook: { title: "Playbook", icon: "📋", width: 320, height: 220,
    render: () => `<textarea id="notes" style="width:100%; height:100%; resize:none;" placeholder="Write plays...">${localStorage.getItem('notes')||''}</textarea>`,
    init: (win) => {
      win.querySelector('#notes').oninput = (e) => localStorage.setItem('notes', e.target.value);
    }
  },
  scoreboard: { title: "Scoreboard", icon: "🏀", width: 300, height: 180,
    render: () => `
      <div style="display:flex; justify-content:space-around; text-align:center;">
        <div><div>HOME</div><div id="score-a" class="num-display">0</div><button onclick="updateScore('a',1)">+1</button></div>
        <div><div>AWAY</div><div id="score-b" class="num-display">0</div><button onclick="updateScore('b',1)">+1</button></div>
      </div>
      <button onclick="updateScore('reset')" style="width:100%; margin-top:12px;">Reset</button>`
  },
  shotclock: { title: "Shot Clock", icon: "⏱", width: 240, height: 160,
    render: () => `
      <div id="timer-disp" class="num-display">24</div>
      <div style="display:flex; gap:6px;">
        <button onclick="toggleShotClock()" style="flex:1;">Start/Stop</button>
        <button onclick="resetShotClock(24)" style="flex:1;">24s</button>
        <button onclick="resetShotClock(14)" style="flex:1;">14s</button>
      </div>`
  },
  terminal: { title: "Terminal", icon: "🖥️", width: 360, height: 200,
    render: () => `
      <div id="term-out" style="height:120px; overflow-y:auto; font-size:11px; margin-bottom:6px;">HoopsOS CLI v1.0<br>Type 'help' or 'clear'.</div>
      <input id="term-in" style="width:100%;" placeholder="Enter command...">`,
    init: (win) => {
      const input = win.querySelector('#term-in');
      const out = win.querySelector('#term-out');
      input.onkeydown = (e) => {
        if(e.key === 'Enter') {
          const cmd = input.value.trim().toLowerCase();
          out.innerHTML += `<div>> ${cmd}</div>`;
          if(cmd === 'help') out.innerHTML += `<div>Apps: playbook, scoreboard, shotclock, settings</div>`;
          else if(cmd === 'clear') out.innerHTML = '';
          else if(APPS[cmd]) openWindow(cmd);
          else out.innerHTML += `<div>Command not found.</div>`;
          input.value = '';
          out.scrollTop = out.scrollHeight;
        }
      }
    }
  },
  settings: { title: "Settings", icon: "⚙️", width: 260, height: 160,
    render: () => `
      <label>Accent Color:</label>
      <input type="color" id="accent-picker" value="#ff7a29" style="width:100%; height:32px; margin-top:6px; cursor:pointer;">`,
    init: (win) => {
      win.querySelector('#accent-picker').onchange = (e) => {
        document.documentElement.style.setProperty('--accent', e.target.value);
      };
    }
  }
};

// Window Manager State
let zIndexCounter = 100;
const runningApps = new Set();

function openWindow(id) {
  if (!APPS[id]) return;
  runningApps.add(id);
  updateDock();

  let win = document.getElementById(`win-${id}`);
  if (win) {
    focusWindow(win);
    return;
  }

  const app = APPS[id];
  win = document.createElement('div');
  win.id = `win-${id}`;
  win.className = 'window';
  win.style.width = app.width + 'px';
  win.style.height = app.height + 'px';
  win.style.left = Math.max(20, Math.random() * (window.innerWidth - app.width - 40)) + 'px';
  win.style.top = Math.max(50, Math.random() * (window.innerHeight - app.height - 80)) + 'px';

  win.innerHTML = `
    <div class="titlebar">
      <span>${app.icon} ${app.title}</span>
      <div class="win-controls">
        <button class="btn-min" onclick="minimizeWindow('${id}')"></button>
        <button class="btn-close" onclick="closeWindow('${id}')"></button>
      </div>
    </div>
    <div class="win-body">${app.render()}</div>
  `;

  document.getElementById('desktop').appendChild(win);
  makeDraggable(win);
  win.addEventListener('mousedown', () => focusWindow(win));
  focusWindow(win);

  if (app.init) app.init(win);
}

function focusWindow(win) {
  document.querySelectorAll('.window').forEach(w => w.classList.remove('focused'));
  win.style.zIndex = ++zIndexCounter;
  win.classList.add('focused');
}

function closeWindow(id) {
  const win = document.getElementById(`win-${id}`);
  if (win) win.remove();
  runningApps.delete(id);
  updateDock();
}

function minimizeWindow(id) {
  const win = document.getElementById(`win-${id}`);
  if (win) win.style.display = win.style.display === 'none' ? 'flex' : 'none';
}

function makeDraggable(win) {
  const titlebar = win.querySelector('.titlebar');
  let ox = 0, oy = 0;

  titlebar.onmousedown = (e) => {
    if (e.target.tagName === 'BUTTON') return;
    ox = e.clientX - win.offsetLeft;
    oy = e.clientY - win.offsetTop;
    document.onmousemove = (e) => {
      win.style.left = Math.max(0, Math.min(window.innerWidth - win.offsetWidth, e.clientX - ox)) + 'px';
      win.style.top = Math.max(32, Math.min(window.innerHeight - win.offsetHeight - 40, e.clientY - oy)) + 'px';
    };
    document.onmouseup = () => document.onmousemove = document.onmouseup = null;
  };
}

// Global App Logic Helpers
let scores = { a: 0, b: 0 };
function updateScore(team, val) {
  if (team === 'reset') scores = { a: 0, b: 0 };
  else scores[team] += val;
  const elA = document.getElementById('score-a');
  const elB = document.getElementById('score-b');
  if (elA) elA.textContent = scores.a;
  if (elB) elB.textContent = scores.b;
}

let shotClock = 24, timerId = null;
function toggleShotClock() {
  if (timerId) { clearInterval(timerId); timerId = null; }
  else {
    timerId = setInterval(() => {
      if (shotClock > 0) {
        shotClock--;
        const disp = document.getElementById('timer-disp');
        if (disp) disp.textContent = shotClock;
      } else { clearInterval(timerId); timerId = null; }
    }, 1000);
  }
}
function resetShotClock(val) {
  shotClock = val;
  const disp = document.getElementById('timer-disp');
  if (disp) disp.textContent = shotClock;
}

// UI Initialization (Icons & Dock)
function setupUI() {
  const grid = document.getElementById('icons-grid');
  Object.keys(APPS).forEach(id => {
    const app = APPS[id];
    const icon = document.createElement('div');
    icon.className = 'app-icon';
    icon.innerHTML = `<div class="glyph">${app.icon}</div><span>${app.title}</span>`;
    icon.ondblclick = () => openWindow(id);
    icon.onclick = () => { if(window.innerWidth < 600) openWindow(id); };
    grid.appendChild(icon);
  });
  updateDock();
}

function updateDock() {
  const dock = document.getElementById('dock');
  dock.innerHTML = '';
  Object.keys(APPS).forEach(id => {
    const app = APPS[id];
    const item = document.createElement('div');
    item.className = `dock-item ${runningApps.has(id) ? 'active' : ''}`;
    item.innerHTML = app.icon;
    item.onclick = () => openWindow(id);
    dock.appendChild(item);
  });
}

// Clock updates
setInterval(() => {
  const d = new Date();
  document.getElementById('clock').textContent = d.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
}, 1000);

setupUI();
</script>
</body>
</html>
